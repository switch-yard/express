network = "open"

[[rule]]
name = "secrets never merge"
match = { added = "AKIA[0-9A-Z]{16}|-----BEGIN ((RSA|EC|DSA|OPENSSH|PGP) )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36}|sk_live_[0-9A-Za-z]{24}|xox[baprs]-[0-9A-Za-z-]{10,}" }
policy = "block"

[[rule]]
name = "docs merge on their own"
match = { path = "\\.(md|mdx|rst|adoc)$" }
policy = "auto-merge"

[[rule]]
name = "tests merge once the checks pass"
match = { path = "(^|/)(tests?|__tests__|spec)/" }
policy = "auto-merge"

[[check]]
name = "GitHub checks"
github = "*"
timeout = "30m"
